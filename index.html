<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LinkUp🌹 - A romantic animated rose experience, perfect for expressing your feelings">
  <meta name="theme-color" content="#000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinkUp">
  
  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="LinkUp🌹">
  <meta property="og:description" content="A romantic animated rose to express your love">
  <meta property="og:type" content="website">
  <meta property="og:image" content="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='90' fill='%23000'/%3E%3Ctext x='100' y='120' font-size='60' text-anchor='middle' dominant-baseline='middle'%3E🌹%3C/text%3E%3C/svg%3E">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="LinkUp🌹">
  <meta name="twitter:description" content="A romantic animated rose to express your love">
  
  <title>LinkUp🌹</title>

  <style>
    :root {
      /* ========================= 
         COLOR PALETTE 
      ========================= */
      --color-bg: #000;
      --color-rose-light: #ff8b91;
      --color-rose-medium: #e92b4c;
      --color-rose-dark: #a0002b;
      --color-rose-darkest: #350009;
      --color-stem: #18a33d;
      --color-text: #fff;
      --color-text-muted: #777;
      --color-accent: #ff174f;
      
      /* ========================= 
         ANIMATION TIMING 
      ========================= */
      --timing-card-fade: 0.8s;
      --timing-stem-grow: 4s;
      --timing-rose-bloom: 5s;
      --timing-message-show: 1.8s;
      
      /* ========================= 
         ANIMATION EASING 
      ========================= */
      --easing-smooth: cubic-bezier(0.2, 0.8, 0.2, 1);
      --easing-bounce: cubic-bezier(0.12, 0.75, 0.2, 1);
      
      /* ========================= 
         RESPONSIVE SIZING 
      ========================= */
      --base-font: clamp(12px, 2vw, 16px);
      --scale: clamp(0.6, 1vw, 1);
    }

    /* ========================= 
       PREFERS REDUCED MOTION 
    ========================= */
    @media (prefers-reduced-motion: reduce) {
      :root {
        --timing-card-fade: 0.1s;
        --timing-stem-grow: 0.5s;
        --timing-rose-bloom: 0.5s;
        --timing-message-show: 0.1s;
      }
      
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ========================= 
       GLOBAL RESET 
    ========================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: var(--color-bg);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* ========================= 
       MAIN SCENE 
    ========================= */
    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 100vw;
      overflow: hidden;
      background: var(--color-bg);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Romantic glow effect */
    .redGlow {
      position: absolute;
      width: clamp(250px, 35vw, 430px);
      height: clamp(250px, 35vw, 430px);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(110, 0, 20, 0.1);
      filter: blur(75px);
      transition: all 2s ease;
      will-change: box-shadow;
    }

    .scene.bloom .redGlow {
      background: rgba(150, 0, 30, 0.18);
      animation: romanticPulse 3s ease-in-out infinite;
    }

    @keyframes romanticPulse {
      0%, 100% {
        box-shadow: 0 0 40px rgba(255, 20, 60, 0.3),
          0 0 80px rgba(255, 0, 50, 0.15);
      }
      50% {
        box-shadow: 0 0 60px rgba(255, 20, 60, 0.5),
          0 0 120px rgba(255, 0, 50, 0.25);
      }
    }

    /* ========================= 
       FLOATING HEARTS 
    ========================= */
    .heart {
      position: absolute;
      font-size: clamp(18px, 3vw, 28px);
      opacity: 0;
      animation: float 4s ease-in forwards;
      filter: drop-shadow(0 0 6px rgba(255, 20, 60, 0.8));
      pointer-events: none;
      will-change: transform;
    }

    .heart1 { left: 20%; bottom: 15%; animation-delay: 9.5s; }
    .heart2 { left: 75%; bottom: 20%; animation-delay: 10s; }
    .heart3 { left: 35%; bottom: 10%; animation-delay: 10.5s; }
    .heart4 { left: 65%; bottom: 18%; animation-delay: 11s; }
    .heart5 { left: 45%; bottom: 12%; animation-delay: 11.5s; }

    @keyframes float {
      0% {
        opacity: 1;
        transform: translateY(0) scale(0);
      }
      10% {
        opacity: 1;
        transform: translateY(-20px) scale(1);
      }
      90% {
        opacity: 1;
        transform: translateY(-180px) scale(1);
      }
      100% {
        opacity: 0;
        transform: translateY(-220px) scale(0.8);
      }
    }

    /* ========================= 
       SPARKLES 
    ========================= */
    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      filter: drop-shadow(0 0 3px rgba(255, 100, 150, 0.9));
      pointer-events: none;
      will-change: transform;
    }

    .spark1 { left: calc(50% - 60px); top: calc(50% - 50px); animation: twinkle 2s ease-in-out infinite; animation-delay: 8.5s; }
    .spark2 { left: calc(50% + 50px); top: calc(50% - 45px); animation: twinkle 2.2s ease-in-out infinite; animation-delay: 8.8s; }
    .spark3 { left: calc(50% - 40px); top: calc(50% + 35px); animation: twinkle 1.8s ease-in-out infinite; animation-delay: 9.1s; }
    .spark4 { left: calc(50% + 70px); top: calc(50% + 25px); animation: twinkle 2.3s ease-in-out infinite; animation-delay: 9.4s; }
    .spark5 { left: calc(50% - 70px); top: calc(50% + 10px); animation: twinkle 1.9s ease-in-out infinite; animation-delay: 8.7s; }

    @keyframes twinkle {
      0%, 100% {
        opacity: 0;
        transform: scale(0);
      }
      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ========================= 
       CARD 
    ========================= */
    .card {
      position: absolute;
      z-index: 20;
      left: 50%;
      top: clamp(30%, 37%, 45%);
      width: clamp(160px, 85vw, 220px);
      max-width: 90vw;
      transform: translate(-50%, -50%);
      padding: clamp(10px, 3vw, 16px);
      background: linear-gradient(
        145deg,
        rgba(32, 5, 12, 0.95),
        rgba(13, 2, 6, 0.95)
      );
      border: 1px solid rgba(255, 30, 70, 0.22);
      border-radius: 4px;
      box-shadow: 0 0 25px rgba(255, 0, 50, 0.06),
        inset 0 0 20px rgba(255, 0, 50, 0.03);
      text-align: center;
      transition: opacity var(--timing-card-fade) ease,
        transform var(--timing-card-fade) ease;
      will-change: opacity, transform;
    }

    .card.hide {
      opacity: 0;
      transform: translate(-50%, -58%) scale(0.9);
      pointer-events: none;
    }

    .card__icon {
      color: #ff123f;
      font-size: clamp(14px, 4vw, 20px);
      margin-bottom: clamp(3px, 1vw, 6px);
      text-shadow: 0 0 8px #ff003c;
      display: block;
    }

    .card__title {
      color: var(--color-text);
      font-size: clamp(12px, 3vw, 16px);
      margin-bottom: clamp(8px, 2vw, 14px);
      font-weight: 600;
    }

    .card__loading {
      color: var(--color-text-muted);
      font-family: Arial, sans-serif;
      font-size: clamp(6px, 1.5vw, 9px);
      margin-bottom: clamp(6px, 1vw, 10px);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .progress {
      width: 100%;
      height: 2px;
      background: #27050c;
      overflow: hidden;
      margin-bottom: clamp(8px, 2vw, 12px);
      border-radius: 1px;
    }

    .progress__bar {
      width: 0;
      height: 100%;
      background: var(--color-accent);
      box-shadow: 0 0 8px var(--color-accent);
      transition: width 3s linear;
      will-change: width;
    }

    .button {
      width: 100%;
      height: clamp(24px, 6vw, 32px);
      border: 0;
      border-radius: 3px;
      background: #281016;
      color: #666;
      font-family: Arial, sans-serif;
      font-size: clamp(6px, 1.5vw, 9px);
      cursor: pointer;
      transition: all 0.4s ease;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      user-select: none;
      -webkit-user-select: none;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .button.ready {
      background: var(--color-accent);
      color: var(--color-text);
      box-shadow: 0 0 10px rgba(255, 20, 80, 0.55),
        0 0 25px rgba(255, 20, 80, 0.2);
      cursor: pointer;
    }

    .button.ready:active {
      transform: scale(0.98);
    }

    .button.ready:hover {
      box-shadow: 0 0 15px rgba(255, 20, 80, 0.75),
        0 0 30px rgba(255, 20, 80, 0.3);
    }

    /* ========================= 
       FLOWER SCENE 
    ========================= */
    .flowerScene {
      position: absolute;
      left: 50%;
      top: clamp(50%, 55%, 60%);
      width: clamp(200px, 55vw, 320px);
      height: clamp(280px, 75vw, 420px);
      transform: translate(-50%, -50%);
    }

    .rose__name {
      position: absolute;
      left: 50%;
      top: 0;
      z-index: 12;
      color: #ffd6dc;
      font-size: clamp(14px, 3vw, 22px);
      font-style: italic;
      letter-spacing: 1px;
      opacity: 0;
      transform: translate(-50%, -8px);
      text-shadow: 0 0 10px rgba(255, 35, 75, 0.65);
      transition: opacity 1.5s ease, transform 1.5s ease;
      white-space: nowrap;
      will-change: opacity, transform;
    }

    .scene.bloom .rose__name {
      opacity: 1;
      transform: translate(-50%, 0);
      transition-delay: 8.2s;
    }

    /* ========================= 
       STEM 
    ========================= */
    .stem {
      position: absolute;
      left: 50%;
      bottom: clamp(30px, 8%, 50px);
      width: 3px;
      height: 0;
      transform: translateX(-50%);
      border-radius: 10px;
      background: linear-gradient(
        to right,
        #043c15,
        var(--color-stem),
        #07541e
      );
      box-shadow: 0 0 4px rgba(0, 255, 70, 0.2);
      transition: height var(--timing-stem-grow) var(--easing-smooth);
      will-change: height;
    }

    .scene.bloom .stem {
      height: clamp(120px, 35%, 200px);
    }

    /* ========================= 
       LEAVES 
    ========================= */
    .leaf {
      position: absolute;
      width: clamp(30px, 8vw, 50px);
      height: clamp(12px, 4vw, 20px);
      background: linear-gradient(135deg, #06451b, #15913a, #042d11);
      opacity: 0;
      box-shadow: 0 0 5px rgba(0, 255, 60, 0.1);
      will-change: opacity, transform;
    }

    .leaf.left {
      left: calc(50% - clamp(30px, 8vw, 50px));
      bottom: clamp(80px, 25%, 140px);
      border-radius: 100% 0 100% 0;
      transform: rotate(-25deg) scale(0);
      transform-origin: right center;
    }

    .leaf.right {
      left: 50%;
      bottom: clamp(60px, 20%, 110px);
      border-radius: 0 100% 0 100%;
      transform: rotate(25deg) scale(0);
      transform-origin: left center;
    }

    .scene.bloom .leaf.left {
      animation: leafLeft 1.5s 3.2s forwards;
    }

    .scene.bloom .leaf.right {
      animation: leafRight 1.5s 3.7s forwards;
    }

    @keyframes leafLeft {
      to {
        opacity: 1;
        transform: rotate(-25deg) scale(1);
      }
    }

    @keyframes leafRight {
      to {
        opacity: 1;
        transform: rotate(25deg) scale(1);
      }
    }

    /* ========================= 
       ROSE 
    ========================= */
    .rose {
      position: absolute;
      left: 50%;
      bottom: clamp(140px, 40%, 240px);
      width: clamp(100px, 25vw, 160px);
      height: clamp(80px, 20vw, 130px);
      transform: translateX(-50%) scale(0.05);
      opacity: 0;
      filter: drop-shadow(0 8px 12px rgba(80, 0, 12, 0.65));
      transition: transform var(--timing-rose-bloom) var(--easing-bounce),
        opacity 1s;
      will-change: transform, opacity;
    }

    .scene.bloom .rose {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* ========================= 
       PETALS 
    ========================= */
    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(40px, 10vw, 65px);
      height: clamp(50px, 13vw, 80px);
      border-radius: 75% 75% 42% 42% / 88% 88% 38% 38%;
      background: radial-gradient(
        ellipse at 42% 18%,
        var(--color-rose-light) 0%,
        var(--color-rose-medium) 24%,
        var(--color-rose-dark) 62%,
        var(--color-rose-darkest) 100%
      );
      box-shadow: inset 0 -12px 16px rgba(50, 0, 8, 0.55),
        inset 4px 3px 8px rgba(255, 130, 140, 0.24),
        0 3px 5px rgba(45, 0, 8, 0.35);
      transform-origin: 50% 90%;
      opacity: 0;
      animation-fill-mode: forwards;
      will-change: opacity;
    }

    .p1 { animation-delay: 4.8s; transform: translate(-50%, -50%) rotate(-68deg) translateY(-11px) scale(0.94); }
    .p2 { animation-delay: 5s; transform: translate(-50%, -50%) rotate(-43deg) translateY(-23px) scale(0.92); }
    .p3 { animation-delay: 5.2s; transform: translate(-50%, -50%) rotate(-18deg) translateY(-32px) scale(0.89); }
    .p4 { animation-delay: 5.4s; transform: translate(-50%, -50%) rotate(18deg) translateY(-32px) scale(0.89); }
    .p5 { animation-delay: 5.6s; transform: translate(-50%, -50%) rotate(43deg) translateY(-23px) scale(0.92); }
    .p6 { animation-delay: 5.8s; transform: translate(-50%, -50%) rotate(68deg) translateY(-11px) scale(0.94); }

    .p7, .p8, .p9, .p10, .p11 {
      width: clamp(35px, 9vw, 55px);
      height: clamp(45px, 11vw, 70px);
      background: radial-gradient(
        ellipse at 45% 20%,
        #ff596d 0%,
        #dc103d 35%,
        #820021 72%,
        var(--color-rose-darkest) 100%
      );
    }

    .p7 { animation-delay: 6.2s; transform: translate(-50%, -50%) rotate(-58deg) translateY(-13px) scale(0.78); }
    .p8 { animation-delay: 6.4s; transform: translate(-50%, -50%) rotate(-31deg) translateY(-20px) scale(0.76); }
    .p9 { animation-delay: 6.6s; transform: translate(-50%, -50%) rotate(-5deg) translateY(-23px) scale(0.72); }
    .p10 { animation-delay: 6.8s; transform: translate(-50%, -50%) rotate(29deg) translateY(-19px) scale(0.76); }
    .p11 { animation-delay: 7s; transform: translate(-50%, -50%) rotate(57deg) translateY(-12px) scale(0.78); }

    .p12 {
      width: clamp(30px, 8vw, 48px);
      height: clamp(40px, 10vw, 65px);
      background: radial-gradient(
        ellipse at 45% 18%,
        #ff6b78 0%,
        #d7113c 42%,
        #680016 100%
      );
      animation-delay: 7.4s;
      transform: translate(-50%, -50%) rotate(-25deg) translateY(-11px) scale(0.68);
    }

    .p13 {
      width: clamp(30px, 8vw, 48px);
      height: clamp(40px, 10vw, 65px);
      animation-delay: 7.6s;
      transform: translate(-50%, -50%) rotate(23deg) translateY(-10px) scale(0.68);
    }

    .p14 {
      width: clamp(23px, 6vw, 36px);
      height: clamp(35px, 9vw, 56px);
      animation-delay: 7.9s;
      transform: translate(-50%, -50%) rotate(8deg) translateY(-7px) scale(0.66);
    }

    .scene.bloom .petal {
      animation: petalBloom 3s ease-out forwards;
    }

    @keyframes petalBloom {
      0% {
        opacity: 0;
        filter: brightness(0.4);
      }
      40% {
        opacity: 0.65;
      }
      75% {
        opacity: 0.95;
      }
      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }

    /* ========================= 
       ROSE CENTER 
    ========================= */
    .center {
      position: absolute;
      left: 50%;
      top: 53%;
      width: clamp(18px, 4vw, 28px);
      height: clamp(20px, 5vw, 32px);
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle at 40% 30%,
        #ff5968,
        #c0002d 50%,
        #4c000e
      );
      opacity: 0;
      z-index: 10;
      transition: opacity 0.7s ease;
      will-change: opacity;
    }

    .scene.bloom .center {
      opacity: 1;
      transition-delay: 8.2s;
    }

    /* ========================= 
       FALLING PETALS 
    ========================= */
    .fallingPetal {
      position: absolute;
      top: -20px;
      width: clamp(5px, 1vw, 9px);
      height: clamp(8px, 2vw, 14px);
      border-radius: 100% 0 100% 0;
      background: #c9002c;
      opacity: 0;
      will-change: transform;
    }

    .scene.bloom .fallingPetal {
      animation: fall 6s linear infinite;
    }

    .fp1 { left: 28%; animation-delay: 8s !important; }
    .fp2 { left: 67%; animation-delay: 9s !important; }
    .fp3 { left: 38%; animation-delay: 10s !important; }
    .fp4 { left: 76%; animation-delay: 11s !important; }
    .fp5 { left: 58%; animation-delay: 12s !important; }

    @keyframes fall {
      0% {
        opacity: 0;
        transform: translateY(-20px) rotate(0);
      }
      15% {
        opacity: 0.7;
      }
      80% {
        opacity: 0.5;
      }
      100% {
        opacity: 0;
        transform: translateY(720px) translateX(-80px) rotate(360deg);
      }
    }

    /* ========================= 
       MESSAGE 
    ========================= */
    .message {
      position: absolute;
      left: 50%;
      bottom: clamp(10%, 12%, 20%);
      width: clamp(140px, 90vw, 200px);
      transform: translateX(-50%) translateY(18px);
      text-align: center;
      opacity: 0;
      transition: opacity var(--timing-message-show) ease,
        transform var(--timing-message-show) ease;
      will-change: opacity, transform;
    }

    .message.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .message__text {
      color: #e8e8e8;
      font-size: clamp(11px, 2.5vw, 15px);
      line-height: 1.45;
      font-style: italic;
      letter-spacing: 0.3px;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.1);
    }

    .message__rose {
      margin-top: clamp(5px, 1vw, 8px);
      font-size: clamp(10px, 2vw, 14px);
      opacity: 0.8;
      filter: drop-shadow(0 0 5px rgba(255, 0, 30, 0.5));
      display: block;
    }

    /* ========================= 
       CONTROLS OVERLAY 
    ========================= */
    .controls {
      position: fixed;
      bottom: clamp(12px, 3vw, 25px);
      right: clamp(12px, 3vw, 25px);
      z-index: 100;
      display: flex;
      gap: clamp(6px, 1.5vw, 12px);
      flex-direction: column;
    }

    .control-btn {
      width: clamp(32px, 8vw, 48px);
      height: clamp(32px, 8vw, 48px);
      border-radius: 50%;
      border: none;
      background: rgba(255, 20, 80, 0.2);
      color: var(--color-accent);
      cursor: pointer;
      font-size: clamp(14px, 3vw, 22px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .control-btn:hover {
      background: rgba(255, 20, 80, 0.4);
      transform: scale(1.1);
    }

    .control-btn:active {
      transform: scale(0.95);
    }

    .control-btn:focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    /* ========================= 
       RESPONSIVE ADJUSTMENTS 
    ========================= */
    @media (max-width: 480px) {
      .scene {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      
      .heart {
        font-size: clamp(16px, 4vw, 24px);
      }

      .button:focus-visible {
        outline: 2px solid var(--color-accent);
        outline-offset: 1px;
      }
    }

    @media (max-width: 360px) {
      .card {
        width: clamp(140px, 95vw, 180px);
      }
      
      .flowerScene {
        width: clamp(160px, 90vw, 260px);
        height: clamp(220px, 65vw, 340px);
      }
    }

    @media (landscape) and (max-height: 500px) {
      .card {
        top: 35%;
      }
      
      .flowerScene {
        top: 60%;
      }
      
      .message {
        bottom: 8%;
      }
      
      .heart {
        font-size: clamp(14px, 2vw, 20px);
      }
    }

    /* ========================= 
       PRINT STYLES 
    ========================= */
    @media print {
      body {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="scene" id="scene">
    <div class="redGlow"></div>

    <!-- CARD INTRO -->
    <div class="card" id="card">
      <div class="card__icon">🌹</div>
      <h1 class="card__title">For Your Patience</h1>

      <div class="card__loading" id="loadingText">Loading...</div>

      <div class="progress">
        <div class="progress__bar" id="progressBar"></div>
      </div>

      <button class="button" id="bloomButton" disabled aria-label="Tap to bloom the rose">
        TAP
      </button>
    </div>

    <!-- FLOWER SCENE -->
    <div class="flowerScene">
      <div class="rose__name" id="roseName">I Miss You</div>

      <div class="stem"></div>

      <div class="leaf left"></div>
      <div class="leaf right"></div>

      <div class="rose">
        <div class="petal p1"></div>
        <div class="petal p2"></div>
        <div class="petal p3"></div>
        <div class="petal p4"></div>
        <div class="petal p5"></div>
        <div class="petal p6"></div>

        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="petal p9"></div>
        <div class="petal p10"></div>
        <div class="petal p11"></div>

        <div class="petal p12"></div>
        <div class="petal p13"></div>
        <div class="petal p14"></div>

        <div class="center"></div>
      </div>

      <div class="fallingPetal fp1"></div>
      <div class="fallingPetal fp2"></div>
      <div class="fallingPetal fp3"></div>
      <div class="fallingPetal fp4"></div>
      <div class="fallingPetal fp5"></div>
    </div>

    <!-- HEARTS -->
    <div class="heart heart1" aria-hidden="true">❤️</div>
    <div class="heart heart2" aria-hidden="true">❤️</div>
    <div class="heart heart3" aria-hidden="true">❤️</div>
    <div class="heart heart4" aria-hidden="true">❤️</div>
    <div class="heart heart5" aria-hidden="true">❤️</div>

    <!-- SPARKLES -->
    <div class="sparkle spark1" aria-hidden="true"></div>
    <div class="sparkle spark2" aria-hidden="true"></div>
    <div class="sparkle spark3" aria-hidden="true"></div>
    <div class="sparkle spark4" aria-hidden="true"></div>
    <div class="sparkle spark5" aria-hidden="true"></div>

    <!-- FINAL MESSAGE -->
    <div class="message" id="message" role="status" aria-live="polite">
      <p class="message__text" id="messageText">With all my love...</p>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="controls">
    <button class="control-btn" id="soundToggle" title="Toggle sound" aria-label="Toggle sound on and off">
      🔊
    </button>
    <button class="control-btn" id="resetBtn" title="Reset animation" aria-label="Reset the animation to start">
      ↻
    </button>
  </div>

  <script>
    /**
     * LinkUp🌹 - Romantic Animated Rose
     * Features: Custom messages, sound control, haptic feedback
     * URL Parameters: ?msg=Your Message&name=Rose Name
     */

    // ========================= 
    // DOM ELEMENTS 
    // ========================= 
    const scene = document.getElementById('scene');
    const card = document.getElementById('card');
    const bloomButton = document.getElementById('bloomButton');
    const progressBar = document.getElementById('progressBar');
    const loadingText = document.getElementById('loadingText');
    const message = document.getElementById('message');
    const messageText = document.getElementById('messageText');
    const roseName = document.getElementById('roseName');
    const soundToggle = document.getElementById('soundToggle');
    const resetBtn = document.getElementById('resetBtn');

    // ========================= 
    // STATE MANAGEMENT 
    // ========================= 
    let isBloomActive = false;
    let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';
    
    // ========================= 
    // URL PARAMETER PARSING 
    // ========================= 
    const urlParams = new URLSearchParams(window.location.search);
    const customMessage = sanitizeText(urlParams.get('msg')) || 'With all my love...';
    const customName = sanitizeText(urlParams.get('name')) || 'I Miss You';
    
    // Set custom values
    messageText.textContent = customMessage;
    roseName.textContent = customName;

    // ========================= 
    // UTILITY FUNCTIONS 
    // ========================= 
    
    /**
     * Sanitize text to prevent XSS (already safe with .textContent, but best practice)
     */
    function sanitizeText(text) {
      if (!text) return null;
      const div = document.createElement('div');
      div.textContent = text;
      return div.textContent;
    }

    /**
     * Trigger haptic feedback on mobile devices
     */
    function triggerHaptic(pattern = 50) {
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try {
          navigator.vibrate(pattern);
        } catch (e) {
          console.debug('Haptic feedback not available');
        }
      }
    }

    // ========================= 
    // AUDIO CONTEXT 
    // ========================= 
    let audioContext;
    try {
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      console.debug('Audio context not available');
      soundEnabled = false;
    }

    /**
     * Play a simple tone using Web Audio API
     * @param {number} frequency - Frequency in Hz
     * @param {number} duration - Duration in seconds
     */
    function playSound(frequency, duration) {
      if (!soundEnabled || !audioContext) return;
      
      try {
        const oscillator = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        oscillator.connect(gain);
        gain.connect(audioContext.destination);
        
        oscillator.frequency.value = frequency;
        oscillator.type = 'sine';
        
        gain.gain.setValueAtTime(0.1, audioContext.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
        
        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration);
      } catch (e) {
        console.debug('Audio playback failed');
      }
    }

    // ========================= 
    // ANIMATION FUNCTIONS 
    // ========================= 

    /**
     * Simulate loading with animated progress bar
     */
    function startLoading() {
      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.random() * 30;
        if (progress > 90) progress = 90;
        progressBar.style.width = progress + '%';
        
        if (progress >= 90) {
          clearInterval(interval);
          loadingText.textContent = 'Ready!';
          bloomButton.classList.add('ready');
          bloomButton.disabled = false;
          playSound(523.25, 0.1); // C5 note
        }
      }, 400);
    }

    /**
     * Bloom animation - reveals rose with effects
     */
    function bloom() {
      if (isBloomActive) return;
      isBloomActive = true;
      
      triggerHaptic(50);
      playSound(659.25, 0.15); // E5 note
      scene.classList.add('bloom');
      card.classList.add('hide');
      
      setTimeout(() => {
        message.classList.add('show');
        triggerHaptic([50, 30, 50]);
        playSound(783.99, 0.2); // G5 note
      }, 8200);
    }

    /**
     * Reset animation to initial state
     */
    function reset() {
      scene.classList.remove('bloom');
      card.classList.remove('hide');
      message.classList.remove('show');
      progressBar.style.width = '0%';
      loadingText.textContent = 'Loading...';
      bloomButton.classList.remove('ready');
      bloomButton.disabled = true;
      isBloomActive = false;
      
      startLoading();
    }

    // ========================= 
    // EVENT LISTENERS 
    // ========================= 
    bloomButton.addEventListener('click', bloom);
    bloomButton.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        bloom();
      }
    });

    soundToggle.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      localStorage.setItem('soundEnabled', soundEnabled);
      soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
      triggerHaptic(30);
    });

    resetBtn.addEventListener('click', () => {
      triggerHaptic(30);
      reset();
    });

    // ========================= 
    // INITIALIZATION 
    // ========================= 
    startLoading();

    // Update sound toggle icon on load
    soundToggle.textContent = soundEnabled ? '🔊' : '🔇';
  </script>
</body>
</html>
