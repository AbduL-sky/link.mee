<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">

  <meta name="description" content="LinkUp🌹 - A romantic animated rose experience">
  <title>LinkUp🌹</title>

  <style>
    :root {
      --bg: #000;
      --rose-light: #ff8b91;
      --rose: #e92b4c;
      --rose-dark: #a0002b;
      --rose-deep: #350009;
      --green: #18a33d;
      --accent: #ff174f;
      --white: #fff;

      --ease: cubic-bezier(.2,.8,.2,1);
      --bounce: cubic-bezier(.12,.75,.2,1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background: #000;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* =========================
       SCENE
    ========================= */

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(
          circle at center,
          rgba(80, 0, 15, .08),
          #000 55%
        );
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .redGlow {
      position: absolute;
      width: clamp(250px, 45vw, 430px);
      height: clamp(250px, 45vw, 430px);
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(110, 0, 20, .08);
      filter: blur(75px);
      transition: 2s ease;
    }

    .scene.bloom .redGlow {
      background: rgba(150, 0, 30, .18);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% {
        box-shadow:
          0 0 40px rgba(255,20,60,.25),
          0 0 80px rgba(255,0,50,.1);
      }

      50% {
        box-shadow:
          0 0 70px rgba(255,20,60,.5),
          0 0 130px rgba(255,0,50,.2);
      }
    }

    /* =========================
       LOADING CARD
    ========================= */

    .card {
      position: absolute;
      z-index: 30;
      left: 50%;
      top: 37%;
      transform: translate(-50%, -50%);
      width: min(85vw, 230px);
      padding: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(35,5,12,.96),
          rgba(10,1,5,.96)
        );

      border: 1px solid rgba(255,30,70,.25);
      border-radius: 5px;

      box-shadow:
        0 0 30px rgba(255,0,50,.08),
        inset 0 0 20px rgba(255,0,50,.03);

      text-align: center;

      transition:
        opacity .8s ease,
        transform .8s ease;
    }

    .card.hide {
      opacity: 0;
      transform: translate(-50%, -58%) scale(.9);
      pointer-events: none;
    }

    .card__icon {
      display: block;
      color: #ff123f;
      font-size: 22px;
      margin-bottom: 6px;
      text-shadow: 0 0 10px #ff003c;
    }

    .card__title {
      color: #fff;
      font-size: 16px;
      margin-bottom: 13px;
    }

    .card__loading {
      color: #777;
      font-family: Arial, sans-serif;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 9px;
    }

    .progress {
      width: 100%;
      height: 2px;
      background: #27050c;
      overflow: hidden;
      border-radius: 2px;
      margin-bottom: 12px;
    }

    .progress__bar {
      width: 0;
      height: 100%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      transition: width 3s linear;
    }

    .button {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 3px;

      background: #281016;
      color: #666;

      font-family: Arial, sans-serif;
      font-size: 9px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;

      cursor: pointer;
      transition: .3s ease;
    }

    .button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .button.ready {
      background: var(--accent);
      color: white;

      box-shadow:
        0 0 12px rgba(255,20,80,.6),
        0 0 30px rgba(255,20,80,.2);
    }

    .button.ready:hover {
      box-shadow:
        0 0 18px rgba(255,20,80,.8),
        0 0 35px rgba(255,20,80,.3);
    }

    /* =========================
       FLOWER
    ========================= */

    .flowerScene {
      position: absolute;
      left: 50%;
      top: 55%;
      width: 320px;
      height: 420px;
      max-width: 90vw;
      transform: translate(-50%, -50%);
    }

    .rose__name {
      position: absolute;
      top: 0;
      left: 50%;
      z-index: 20;

      color: #ffd6dc;
      font-size: clamp(14px, 4vw, 22px);
      font-style: italic;
      letter-spacing: 1px;
      white-space: nowrap;

      opacity: 0;
      transform: translate(-50%, -8px);

      text-shadow: 0 0 12px rgba(255,35,75,.7);

      transition:
        opacity 1.5s ease,
        transform 1.5s ease;
    }

    .scene.bloom .rose__name {
      opacity: 1;
      transform: translate(-50%, 0);
      transition-delay: 8.2s;
    }

    /* =========================
       STEM
    ========================= */

    .stem {
      position: absolute;
      left: 50%;
      bottom: 35px;

      width: 3px;
      height: 0;

      transform: translateX(-50%);

      border-radius: 10px;

      background:
        linear-gradient(
          to right,
          #043c15,
          var(--green),
          #07541e
        );

      box-shadow: 0 0 5px rgba(0,255,70,.2);

      transition:
        height 4s var(--ease);
    }

    .scene.bloom .stem {
      height: 185px;
    }

    /* =========================
       LEAVES
    ========================= */

    .leaf {
      position: absolute;

      width: 50px;
      height: 20px;

      background:
        linear-gradient(
          135deg,
          #06451b,
          #15913a,
          #042d11
        );

      opacity: 0;

      box-shadow: 0 0 5px rgba(0,255,60,.15);
    }

    .leaf.left {
      left: calc(50% - 50px);
      bottom: 125px;

      border-radius: 100% 0 100% 0;

      transform:
        rotate(-25deg)
        scale(0);

      transform-origin: right center;
    }

    .leaf.right {
      left: 50%;
      bottom: 105px;

      border-radius: 0 100% 0 100%;

      transform:
        rotate(25deg)
        scale(0);

      transform-origin: left center;
    }

    .scene.bloom .leaf.left {
      animation: leafLeft 1.5s 3.2s forwards;
    }

    .scene.bloom .leaf.right {
      animation: leafRight 1.5s 3.7s forwards;
    }

    @keyframes leafLeft {
      to {
        opacity: 1;
        transform: rotate(-25deg) scale(1);
      }
    }

    @keyframes leafRight {
      to {
        opacity: 1;
        transform: rotate(25deg) scale(1);
      }
    }

    /* =========================
       ROSE
    ========================= */

    .rose {
      position: absolute;
      left: 50%;
      bottom: 215px;

      width: 160px;
      height: 130px;

      transform:
        translateX(-50%)
        scale(.05);

      opacity: 0;

      filter:
        drop-shadow(
          0 8px 15px rgba(80,0,12,.7)
        );

      transition:
        transform 5s var(--bounce),
        opacity 1s ease;
    }

    .scene.bloom .rose {
      opacity: 1;
      transform:
        translateX(-50%)
        scale(1);
    }

    /* =========================
       PETALS
    ========================= */

    .petal {
      position: absolute;

      left: 50%;
      top: 50%;

      width: 65px;
      height: 80px;

      border-radius:
        75% 75% 42% 42% /
        88% 88% 38% 38%;

      background:
        radial-gradient(
          ellipse at 42% 18%,
          var(--rose-light) 0%,
          var(--rose) 24%,
          var(--rose-dark) 62%,
          var(--rose-deep) 100%
        );

      box-shadow:
        inset 0 -12px 16px rgba(50,0,8,.55),
        inset 4px 3px 8px rgba(255,130,140,.24),
        0 3px 5px rgba(45,0,8,.35);

      opacity: 0;

      transform-origin: 50% 90%;
    }

    .p1 {
      transform: translate(-50%,-50%)
                 rotate(-68deg)
                 translateY(-11px)
                 scale(.94);
      animation-delay: 4.8s;
    }

    .p2 {
      transform: translate(-50%,-50%)
                 rotate(-43deg)
                 translateY(-23px)
                 scale(.92);
      animation-delay: 5s;
    }

    .p3 {
      transform: translate(-50%,-50%)
                 rotate(-18deg)
                 translateY(-32px)
                 scale(.89);
      animation-delay: 5.2s;
    }

    .p4 {
      transform: translate(-50%,-50%)
                 rotate(18deg)
                 translateY(-32px)
                 scale(.89);
      animation-delay: 5.4s;
    }

    .p5 {
      transform: translate(-50%,-50%)
                 rotate(43deg)
                 translateY(-23px)
                 scale(.92);
      animation-delay: 5.6s;
    }

    .p6 {
      transform: translate(-50%,-50%)
                 rotate(68deg)
                 translateY(-11px)
                 scale(.94);
      animation-delay: 5.8s;
    }

    .p7,
    .p8,
    .p9,
    .p10,
    .p11 {
      width: 55px;
      height: 70px;

      background:
        radial-gradient(
          ellipse at 45% 20%,
          #ff596d 0%,
          #dc103d 35%,
          #820021 72%,
          var(--rose-deep) 100%
        );
    }

    .p7 {
      transform: translate(-50%,-50%)
                 rotate(-58deg)
                 translateY(-13px)
                 scale(.78);
      animation-delay: 6.2s;
    }

    .p8 {
      transform: translate(-50%,-50%)
                 rotate(-31deg)
                 translateY(-20px)
                 scale(.76);
      animation-delay: 6.4s;
    }

    .p9 {
      transform: translate(-50%,-50%)
                 rotate(-5deg)
                 translateY(-23px)
                 scale(.72);
      animation-delay: 6.6s;
    }

    .p10 {
      transform: translate(-50%,-50%)
                 rotate(29deg)
                 translateY(-19px)
                 scale(.76);
      animation-delay: 6.8s;
    }

    .p11 {
      transform: translate(-50%,-50%)
                 rotate(57deg)
                 translateY(-12px)
                 scale(.78);
      animation-delay: 7s;
    }

    .p12,
    .p13 {
      width: 48px;
      height: 65px;
    }

    .p12 {
      transform: translate(-50%,-50%)
                 rotate(-25deg)
                 translateY(-11px)
                 scale(.68);
      animation-delay: 7.4s;
    }

    .p13 {
      transform: translate(-50%,-50%)
                 rotate(23deg)
                 translateY(-10px)
                 scale(.68);
      animation-delay: 7.6s;
    }

    .p14 {
      width: 36px;
      height: 56px;

      transform: translate(-50%,-50%)
                 rotate(8deg)
                 translateY(-7px)
                 scale(.66);

      animation-delay: 7.9s;
    }

    .scene.bloom .petal {
      animation:
        petalBloom 3s ease-out forwards;
    }

    @keyframes petalBloom {
      0% {
        opacity: 0;
        filter: brightness(.4);
      }

      40% {
        opacity: .65;
      }

      75% {
        opacity: .95;
      }

      100% {
        opacity: 1;
        filter: brightness(1);
      }
    }

    /* =========================
       CENTER
    ========================= */

    .center {
      position: absolute;

      left: 50%;
      top: 53%;

      width: 28px;
      height: 32px;

      transform:
        translate(-50%,-50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 40% 30%,
          #ff5968,
          #c0002d 50%,
          #4c000e
        );

      opacity: 0;
      z-index: 20;

      transition: opacity .7s ease;
    }

    .scene.bloom .center {
      opacity: 1;
      transition-delay: 8.2s;
    }

    /* =========================
       HEARTS
    ========================= */

    .heart {
      position: absolute;

      font-size: 25px;

      opacity: 0;

      pointer-events: none;

      filter:
        drop-shadow(
          0 0 7px rgba(255,20,60,.8)
        );
    }

    .scene.bloom .heart {
      animation: floatHeart 4s ease-in forwards;
    }

    .heart1 {
      left: 20%;
      bottom: 15%;
      animation-delay: 9.5s !important;
    }

    .heart2 {
      left: 75%;
      bottom: 20%;
      animation-delay: 10s !important;
    }

    .heart3 {
      left: 35%;
      bottom: 10%;
      animation-delay: 10.5s !important;
    }

    .heart4 {
      left: 65%;
      bottom: 18%;
      animation-delay: 11s !important;
    }

    .heart5 {
      left: 45%;
      bottom: 12%;
      animation-delay: 11.5s !important;
    }

    @keyframes floatHeart {
      0% {
        opacity: 1;
        transform:
          translateY(0)
          scale(0);
      }

      10% {
        transform:
          translateY(-20px)
          scale(1);
      }

      90% {
        opacity: 1;
        transform:
          translateY(-180px)
          scale(1);
      }

      100% {
        opacity: 0;
        transform:
          translateY(-230px)
          scale(.7);
      }
    }

    /* =========================
       SPARKLES
    ========================= */

    .sparkle {
      position: absolute;

      width: 4px;
      height: 4px;

      background: #fff;

      border-radius: 50%;

      opacity: 0;

      box-shadow:
        0 0 8px rgba(255,100,150,.9);
    }

    .scene.bloom .sparkle {
      animation: twinkle 2s ease-in-out infinite;
    }

    .spark1 {
      left: calc(50% - 60px);
      top: calc(50% - 50px);
      animation-delay: 8.5s !important;
    }

    .spark2 {
      left: calc(50% + 50px);
      top: calc(50% - 45px);
      animation-delay: 8.8s !important;
    }

    .spark3 {
      left: calc(50% - 40px);
      top: calc(50% + 35px);
      animation-delay: 9.1s !important;
    }

    .spark4 {
      left: calc(50% + 70px);
      top: calc(50% + 25px);
      animation-delay: 9.4s !important;
    }

    .spark5 {
      left: calc(50% - 70px);
      top: calc(50% + 10px);
      animation-delay: 8.7s !important;
    }

    @keyframes twinkle {
      0%,100% {
        opacity: 0;
        transform: scale(0);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =========================
       FALLING PETALS
    ========================= */

    .fallingPetal {
      position: absolute;

      top: -20px;

      width: 8px;
      height: 13px;

      border-radius:
        100% 0 100% 0;

      background: #c9002c;

      opacity: 0;
    }

    .scene.bloom .fallingPetal {
      animation: fall 6s linear infinite;
    }

    .fp1 {
      left: 28%;
      animation-delay: 8s !important;
    }

    .fp2 {
      left: 67%;
      animation-delay: 9s !important;
    }

    .fp3 {
      left: 38%;
      animation-delay: 10s !important;
    }

    .fp4 {
      left: 76%;
      animation-delay: 11s !important;
    }

    .fp5 {
      left: 58%;
      animation-delay: 12s !important;
    }

    @keyframes fall {
      0% {
        opacity: 0;
        transform:
          translateY(-20px)
          rotate(0);
      }

      15% {
        opacity: .7;
      }

      80% {
        opacity: .5;
      }

      100% {
        opacity: 0;
        transform:
          translateY(720px)
          translateX(-80px)
          rotate(360deg);
      }
    }

    /* =========================
       MESSAGE
    ========================= */

    .message {
      position: absolute;

      left: 50%;
      bottom: 11%;

      width: min(90vw, 230px);

      text-align: center;

      opacity: 0;

      transform:
        translateX(-50%)
        translateY(18px);

      transition:
        opacity 1.8s ease,
        transform 1.8s ease;
    }

    .message.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    .message__text {
      color: #e8e8e8;

      font-size: clamp(11px, 3vw, 15px);

      line-height: 1.45;

      font-style: italic;

      text-shadow:
        0 0 8px rgba(255,255,255,.1);
    }

    .message__rose {
      display: block;

      margin-top: 7px;

      font-size: 14px;

      filter:
        drop-shadow(
          0 0 5px rgba(255,0,30,.5)
        );
    }

    /* =========================
       CONTROLS
    ========================= */

    .controls {
      position: fixed;

      right: 15px;
      bottom: 18px;

      z-index: 100;

      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .control-btn {
      width: 44px;
      height: 44px;

      border: none;

      border-radius: 50%;

      background:
        rgba(255,20,80,.18);

      color: var(--accent);

      cursor: pointer;

      font-size: 19px;

      display: flex;

      justify-content: center;
      align-items: center;

      backdrop-filter: blur(10px);

      transition: .3s ease;
    }

    .control-btn:hover {
      background:
        rgba(255,20,80,.4);

      transform: scale(1.08);
    }

    .control-btn:active {
      transform: scale(.95);
    }

    .control-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 500px) {
      .flowerScene {
        width: 260px;
        height: 370px;
      }

      .rose {
        bottom: 195px;
        transform:
          translateX(-50%)
          scale(.05);
      }

      .scene.bloom .rose {
        transform:
          translateX(-50%)
          scale(.78);
      }

      .scene.bloom .stem {
        height: 165px;
      }

      .leaf.left {
        bottom: 110px;
      }

      .leaf.right {
        bottom: 95px;
      }

      .message {
        bottom: 9%;
      }

      .controls {
        right: 10px;
        bottom: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>

  <main class="scene" id="scene">

    <div class="redGlow"></div>

    <!-- Loading Card -->
    <section class="card" id="card">

      <span class="card__icon">🌹</span>

      <h1 class="card__title">
        Special for you Patience
      </h1>

      <div class="card__loading" id="loadingText">
        Preparing...
      </div>

      <div class="progress">
        <div class="progress__bar" id="progressBar"></div>
      </div>

      <button
        class="button"
        id="startButton"
        disabled
      >
        Please wait...
      </button>

    </section>

    <!-- Flower -->
    <div class="flowerScene">

      <div class="rose__name">
        I Miss You 🫂❤️
      </div>

      <div class="rose" id="rose">

        <div class="petal p1">🫂</div>
        <div class="petal p2">🫂</div>
        <div class="petal p3">🫂</div>
        <div class="petal p4">🫂</div>
        <div class="petal p5">🫂</div>
        <div class="petal p6">🫂</div>

        <div class="petal p7"></div>
        <div class="petal p8"></div>
        <div class="petal p9"></div>
        <div class="petal p10"></div>
        <div class="petal p11"></div>

        <div class="petal p12"></div>
        <div class="petal p13"></div>
        <div class="petal p14"></div>

        <div class="center"></div>

      </div>

      <div class="stem"></div>

      <div class="leaf left"></div>
      <div class="leaf right"></div>

    </div>

    <!-- Sparkles -->
    <div class="sparkle spark1"></div>
    <div class="sparkle spark2"></div>
    <div class="sparkle spark3"></div>
    <div class="sparkle spark4"></div>
    <div class="sparkle spark5"></div>

    <!-- Falling Petals -->
    <div class="fallingPetal fp1">🌹</div>
    <div class="fallingPetal fp2">🌹</div>
    <div class="fallingPetal fp3">🌹</div>
    <div class="fallingPetal fp4">🌹</div>
    <div class="fallingPetal fp5">🌹</div>

    <!-- Hearts -->
    <div class="heart heart1">❤️</div>
    <div class="heart heart2">❤️</div>
    <div class="heart heart3">❤️</div>
    <div class="heart heart4">❤️</div>
    <div class="heart heart5">❤️</div>

    <!-- Message -->
    <div class="message" id="message">

      <div class="message__text">
        Some flowers fade with time,
        but the feelings behind this one
        will always remain PePe. ❤️
      </div>

      <span class="message__rose">
        🌹
      </span>

    </div>

    <!-- Controls -->
    <div class="controls">

      <button
        class="control-btn"
        id="replayBtn"
        title="Replay"
        aria-label="Replay animation"
      >
        ↻
      </button> 
      
    </div>

  </main>

  <script>
    /* =========================
       ELEMENTS
    ========================= */

    const scene = document.getElementById("scene");
    const card = document.getElementById("card");
    const progressBar = document.getElementById("progressBar");
    const startButton = document.getElementById("startButton");
    const loadingText = document.getElementById("loadingText");
    const message = document.getElementById("message");
    const replayBtn = document.getElementById("replayBtn");
    const soundBtn = document.getElementById("soundBtn");

    let soundOn = false;
    let audioContext = null;

    /* =========================
       LOADING
    ========================= */

    window.addEventListener("load", () => {

      setTimeout(() => {
        progressBar.style.width = "100%";
      }, 100);

      setTimeout(() => {
        loadingText.textContent = "Ready";

        startButton.disabled = false;

        startButton.textContent = "Open";

        startButton.classList.add("ready");
      }, 3200);

    });

    /* =========================
       START
    ========================= */

    startButton.addEventListener("click", () => {

      card.classList.add("hide");

      scene.classList.add("bloom");

      setTimeout(() => {
        message.classList.add("show");
      }, 9000);

      if (soundOn) {
        startSound();
      }

    });

    /* =========================
       REPLAY
    ========================= */

    replayBtn.addEventListener("click", () => {

      message.classList.remove("show");

      scene.classList.remove("bloom");

      /*
       * Force browser to rebuild
       * animation timeline.
       */
      void scene.offsetWidth;

      setTimeout(() => {
        scene.classList.add("bloom");
      }, 100);

      setTimeout(() => {
        message.classList.add("show");
      }, 9100);

    });

    /* =========================
       SIMPLE ROMANTIC SOUND
    ========================= */

    function startSound() {

      if (!audioContext) {
        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();
      }

      const oscillator =
        audioContext.createOscillator();

      const gain =
        audioContext.createGain();

      oscillator.type = "sine";

      oscillator.frequency.value = 220;

      gain.gain.setValueAtTime(
        0.0001,
        audioContext.currentTime
      );

      gain.gain.exponentialRampToValueAtTime(
        0.03,
        audioContext.currentTime + 1
      );

      gain.gain.exponentialRampToValueAtTime(
        0.0001,
        audioContext.currentTime + 5
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start();

      oscillator.stop(
        audioContext.currentTime
    });

  </script>
