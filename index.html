<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Love.css — Bloom</title>

  <style>
    /* =========================
       VARIABLES & BASE
    ========================= */
    :root{
      --bg:#050207;
      --card-bg:linear-gradient(145deg, rgba(32,5,12,.95), rgba(13,2,6,.95));
      --accent:#ff2d55;    /* primary rose color */
      --accent-weak:rgba(255,45,85,.12);
      --muted:#9aa0a6;
      --glass:#1b0b0f;
      --max-width:720px;
      --container-padding:1.25rem;
      --ui-radius:.4rem;
      --transition:300ms ease;
    }

    /* Respect reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
    }

    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      color:#fff;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height:1.35;
    }

    /* Centered app container so it scales nicely across devices */
    .app{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:clamp(12px,3vh,32px);
    }

    .scene{
      width:100%;
      max-width:var(--max-width);
      aspect-ratio: 9 / 16; /* portrait feel; scales on wide screens */
      background:transparent;
      position:relative;
      overflow:hidden;
      border-radius: .6rem;
      box-shadow: 0 6px 30px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.02);
      padding: clamp(14px, 2.2vh, 28px);
      box-sizing:border-box;
    }

    /* subtle red atmosphere */
    .redGlow{
      position:absolute;
      inset:0;
      pointer-events:none;
      display:block;
      width:clamp(180px,30vw,420px);
      height:clamp(180px,30vw,420px);
      left:50%;
      top:46%;
      transform:translate(-50%,-50%);
      border-radius:50%;
      background:var(--accent-weak);
      filter:blur(60px);
      transition:var(--transition);
      z-index:1;
      opacity:.9;
    }

    .scene.bloom .redGlow{
      background:rgba(255,45,85,.18);
      animation:romanticPulse 3s ease-in-out infinite;
    }

    @keyframes romanticPulse{
      0%,100%{ box-shadow: 0 0 28px rgba(255,40,80,.25), 0 0 70px rgba(255,10,40,.12); }
      50%{ box-shadow: 0 0 48px rgba(255,40,80,.45), 0 0 110px rgba(255,10,40,.22); }
    }

    /* =========================
       UI CARD
    ========================= */

    .card{
      position:relative;
      z-index:12;
      width:min(88%, 260px);
      margin:0 auto;
      padding:calc(var(--container-padding) / 1.2);
      background:var(--card-bg);
      border:1px solid rgba(255,45,85,.14);
      border-radius:var(--ui-radius);
      box-shadow: 0 8px 30px rgba(0,0,0,.6), inset 0 0 16px rgba(255,0,50,.02);
      text-align:center;
      color: #fff;
      display:flex;
      flex-direction:column;
      gap: .5rem;
      align-items:center;
      transform:translateY(0);
      transition: transform var(--transition), opacity var(--transition);
      font-size: 0.88rem;
    }

    .card.hide{ opacity:0; transform:translateY(-8px) scale(.98); pointer-events:none; }

    .roseIcon{
      font-size:1.1rem;
      color:var(--accent);
      text-shadow: 0 0 8px rgba(255,20,60,.18);
      margin-bottom:2px;
    }

    .card h1{
      margin:0;
      font-size: clamp(1rem, 2.6vw, 1.2rem);
      font-weight:600;
      color:#fff;
      letter-spacing:0.2px;
    }

    .loadingText{
      color:var(--muted);
      font-size: .72rem;
      font-family:Arial, sans-serif;
      width:100%;
    }

    .progress{
      width:100%;
      height:6px;
      background:rgba(39,5,12,.75);
      border-radius:99px;
      overflow:hidden;
      margin-top:6px;
      box-shadow: inset 0 -1px 4px rgba(0,0,0,.6);
    }

    .progressBar{
      width:0%;
      height:100%;
      background: linear-gradient(90deg, var(--accent), #ff7a9a);
      box-shadow: 0 0 8px rgba(255,45,85,.22);
      transition: width 2.8s linear;
    }

    .bloomButton{
      width:100%;
      min-height:44px; /* accessible tap target */
      margin-top:6px;
      border:0;
      border-radius:6px;
      background:var(--glass);
      color:var(--muted);
      font-weight:700;
      letter-spacing:.6px;
      font-size:.82rem;
      cursor:pointer;
      transition: box-shadow var(--transition), background var(--transition), color var(--transition), transform var(--transition);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:.5rem;
      padding:.4rem .6rem;
    }

    .bloomButton:disabled{ opacity:.6; cursor:not-allowed; transform:none; }

    .bloomButton.ready{
      background: linear-gradient(180deg, #ff3c66, #ff2d55);
      color:#fff;
      box-shadow: 0 10px 30px rgba(255,45,85,.18), 0 3px 10px rgba(0,0,0,.45);
    }

    .bloomButton:focus{
      outline:3px solid rgba(255,45,85,.14);
      outline-offset:3px;
      border-radius:8px;
    }

    /* =========================
       FLOWER AREA
    ========================= */

    .flowerScene{
      position:absolute;
      left:50%;
      top:44%;
      transform:translate(-50%, -8%);
      width:min(86%,380px);
      height:auto;
      z-index:6;
      pointer-events:none;
      display:block;
    }

    .roseName{
      display:flex;
      align-text:center;
      position:absolute;
      left:50%;
      top:-2rem;
      transform:translateX(-50%) translateY(-6px);
      color:#ffdfe4;
      font-size: clamp(0.95rem, 2.5vw, 1.05rem);
      font-style:italic;
      opacity:0;
      text-shadow:0 0 8px rgba(255,35,75,.45);
      transition: opacity 1.2s ease, transform 1.2s ease;
      white-space:nowrap;
      z-index:10;
    }

    .scene.bloom .roseName{ opacity:1; transform:translateX(-50%) translateY(0); transition-delay:7.8s; }

    /* STEM */
    .stem{
      position:relative;
      margin:0 auto;
      width:4px;
      height:0;
      border-radius:99px;
      background: linear-gradient(90deg,#043c15,#18a33d,#07541e);
      box-shadow: 0 0 6px rgba(0,255,70,.06);
      transition: height 3.6s cubic-bezier(.2,.8,.2,1);
      transform-origin:bottom center;
      z-index:4;
    }
    .scene.bloom .stem{ height:clamp(80px, 26vh, 190px); }

    /* Leaves */
    .leaf{
      position:absolute;
      width:clamp(46px,10vw,84px);
      height:clamp(18px,4.2vw,28px);
      background: linear-gradient(135deg,#06451b,#15913a,#042d11);
      opacity:0;
      box-shadow:0 0 5px rgba(0,255,60,.06);
      z-index:5;
    }
    .leaf.left{ left:calc(50% - 54px); bottom:110px; transform-origin:right center; transform: rotate(-25deg) scale(0); border-radius:100% 0 100% 0; }
    .leaf.right{ left:calc(50% + 15px); bottom:90px; transform-origin:left center; transform: rotate(25deg) scale(0); border-radius:0 100% 0 100%; }

    .scene.bloom .leaf.left{ animation:leafLeft 1.2s 3.2s forwards; }
    .scene.bloom .leaf.right{ animation:leafRight 1.2s 3.7s forwards; }

    @keyframes leafLeft{ to{ opacity:1; transform: rotate(-25deg) scale(1); } }
    @keyframes leafRight{ to{ opacity:1; transform: rotate(25deg) scale(1); } }

    /* ROSE and PETALS: kept structure but relative sizing */
    .rose{
      width:clamp(110px, 30vw, 180px);
      height:auto;
      margin: 0 auto;
      transform: scale(.06);
      opacity:0;
      transition: transform 4.6s cubic-bezier(.12,.75,.2,1), opacity .9s;
      filter: drop-shadow(0 8px 12px rgba(80,0,12,.5));
      position:relative;
      z-index:7;
    }
    .scene.bloom .rose{ opacity:1; transform: scale(1); }

    .petal{
      position:absolute;
      left:50%;
      top:50%;
      width:clamp(38px,9vw,68px);
      height:clamp(48px,10.5vw,90px);
      border-radius: 75% 75% 42% 42% / 88% 88% 38% 38%;
      transform-origin:50% 90%;
      opacity:0;
      box-shadow: inset 0 -10px 14px rgba(50,0,8,.45), inset 4px 3px 8px rgba(255,130,140,.18), 0 3px 5px rgba(45,0,8,.25);
      animation-fill-mode:forwards;
      z-index:6;
      background: radial-gradient(ellipse at 42% 18%, #ff8b91 0%, #e92b4c 24%, #a0002b 62%, #350009 100%);
    }

    /* Position classes (kept simplified; rotate + offset) */
    .p1{ transform: translate(-50%,-50%) rotate(-68deg) translateY(-11px) scale(.94); animation-delay:4.6s; }
    .p2{ transform: translate(-50%,-50%) rotate(-43deg) translateY(-23px) scale(.92); animation-delay:4.8s; }
    .p3{ transform: translate(-50%,-50%) rotate(-18deg) translateY(-32px) scale(.89); animation-delay:5s; }
    .p4{ transform: translate(-50%,-50%) rotate(18deg) translateY(-32px) scale(.89); animation-delay:5.2s; }
    .p5{ transform: translate(-50%,-50%) rotate(43deg) translateY(-23px) scale(.92); animation-delay:5.4s; }
    .p6{ transform: translate(-50%,-50%) rotate(68deg) translateY(-11px) scale(.94); animation-delay:5.6s; }

    /* second layer */
    .p7,.p8,.p9,.p10,.p11{ background: radial-gradient(ellipse at 45% 20%, #ff596d 0%, #dc103d 35%, #820021 72%, #350009 100%); }
    .p7{ animation-delay:6s; transform: translate(-50%,-50%) rotate(-58deg) translateY(-13px) scale(.78); }
    .p8{ animation-delay:6.2s; transform: translate(-50%,-50%) rotate(-31deg) translateY(-20px) scale(.76); }
    .p9{ animation-delay:6.4s; transform: translate(-50%,-50%) rotate(-5deg) translateY(-23px) scale(.72); }
    .p10{ animation-delay:6.6s; transform: translate(-50%,-50%) rotate(29deg) translateY(-19px) scale(.76); }
    .p11{ animation-delay:6.8s; transform: translate(-50%,-50%) rotate(57deg) translateY(-12px) scale(.78); }

    .p12{ width:clamp(30px,7.2vw,48px); height:clamp(44px,9.6vw,68px); animation-delay:7.2s; transform: translate(-50%,-50%) rotate(-25deg) translateY(-11px) scale(.68); background: radial-gradient(ellipse at 42% 18%, #ff8b91 0%, #e92b4c 24%, #a0002b 62%, #350009 100%); }
    .p13{ width:clamp(30px,7.2vw,48px); height:clamp(44px,9.6vw,68px); animation-delay:7.4s; transform: translate(-50%,-50%) rotate(23deg) translateY(-10px) scale(.68); }
    .p14{ width:clamp(24px,5.6vw,40px); height:clamp(36px,7.6vw,56px); animation-delay:7.6s; transform: translate(-50%,-50%) rotate(8deg) translateY(-7px) scale(.66); }

    /* bloom animation */
    .scene.bloom .petal{ animation-name:petalBloom; animation-duration:1.2s; animation-timing-function:ease-out; animation-fill-mode:forwards; }
    @keyframes petalBloom{
      0%{ opacity:0; filter:brightness(.45); transform-origin:50% 90%; }
      50%{ opacity:.6; }
      100%{ opacity:1; filter:brightness(1); }
    }

    /* center */
    .center{
      position:absolute;
      left:50%;
      top:52%;
      width:clamp(18px,3.8vw,28px);
      height:clamp(18px,3.8vw,28px);
      transform:translate(-50%,-50%);
      border-radius:50%;
      background: radial-gradient(circle at 40% 30%, #ff5968, #c0002d 50%, #4c000e);
      opacity:0;
      z-index:9;
      transition: opacity .7s;
    }
    .scene.bloom .center{ opacity:1; transition-delay:7.8s; }

    /* falling petals */
    .fallingPetal{
      position:absolute;
      top:-12px;
      width:8px;
      height:12px;
      border-radius: 100% 0 100% 0;
      background:#c9002c;
      opacity:0;
      z-index:5;
    }
    .scene.bloom .fallingPetal{ animation:fall 6s linear infinite; }
    .fp1{ left:20%; animation-delay:8s!important; }
    .fp2{ left:70%; animation-delay:9s!important; }
    .fp3{ left:38%; animation-delay:10s!important; }
    .fp4{ left:82%; animation-delay:11s!important; }
    .fp5{ left:56%; animation-delay:12s!important; }
    @keyframes fall{
      0%{ opacity:0; transform: translateY(-12px) rotate(0); }
      15%{ opacity:.7; }
      80%{ opacity:.5; }
      100%{ opacity:0; transform: translateY(720px) translateX(-80px) rotate(360deg); }
    }

    /* floating hearts */
    .heart{
      position:absolute;
      font-size:clamp(14px,3.2vw,26px);
      filter:drop-shadow(0 0 6px rgba(255,20,60,.7));
      opacity:0;
      pointer-events:none;
      z-index:8;
      animation:float 4s ease-in forwards;
    }
    .heart1{ left:18%; bottom:12%; animation-delay:9.5s; }
    .heart2{ left:76%; bottom:18%; animation-delay:10s; font-size:clamp(12px,2.6vw,20px); }
    .heart3{ left:36%; bottom:8%; animation-delay:10.5s; }
    .heart4{ left:64%; bottom:15%; animation-delay:11s; font-size:clamp(12px,2.6vw,18px); }
    .heart5{ left:46%; bottom:10%; animation-delay:11.5s; }
    @keyframes float{
      0%{ opacity:1; transform: translateY(0) scale(.0); }
      10%{ opacity:1; transform: translateY(-16px) scale(1); }
      90%{ opacity:1; transform: translateY(-160px) scale(1); }
      100%{ opacity:0; transform: translateY(-200px) scale(.8); }
    }

    /* sparkles */
    .sparkle{
      position:absolute;
      width:6px;
      height:6px;
      background:#fff;
      border-radius:50%;
      opacity:0;
      filter:drop-shadow(0 0 3px rgba(255,100,150,.9));
      pointer-events:none;
      z-index:9;
    }
    .spark1{ left:calc(50% - 60px); top:calc(50% - 50px); animation:twinkle 2s ease-in-out infinite; animation-delay:8.5s; }
    .spark2{ left:calc(50% + 50px); top:calc(50% - 45px); animation:twinkle 2.2s ease-in-out infinite; animation-delay:8.8s; }
    .spark3{ left:calc(50% - 40px); top:calc(50% + 35px); animation:twinkle 1.8s ease-in-out infinite; animation-delay:9.1s; }
    .spark4{ left:calc(50% + 70px); top:calc(50% + 25px); animation:twinkle 2.3s ease-in-out infinite; animation-delay:9.4s; }
    .spark5{ left:calc(50% - 70px); top:calc(50% + 10px); animation:twinkle 1.9s ease-in-out infinite; animation-delay:8.7s; }
    @keyframes twinkle{ 0%,100%{ opacity:0; transform:scale(0); } 50%{ opacity:1; transform:scale(1); } }

    /* final message */
    .message{
      position:absolute;
      left:50%;
      bottom:8%;
      width:min(86%,220px);
      transform:translateX(-50%) translateY(14px);
      text-align:center;
      opacity:0;
      transition: opacity 1.4s ease, transform 1.4s ease;
      z-index:12;
    }
    .scene.bloom .message{ opacity:1; transform:translateX(-50%) translateY(0); transition-delay:10.4s; }
    .messageText{ color:#d9d9d9; font-size: clamp(.95rem, 2.2vw, 1rem); font-style:italic; letter-spacing:.2px; }
    .messageRose{ margin-top:.45rem; font-size:1.05rem; opacity:.95; filter: drop-shadow(0 0 5px rgba(255,0,30,.3)); }

    /* responsive adjustments */
    @media (max-width:420px){
      .flowerScene{ top:40%; transform:translate(-50%,-4%); }
      .scene{ padding:12px; border-radius:.5rem; }
      .roseName{ font-size:.95rem; top:-1.8rem; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="scene" id="scene" aria-label="Love bloom scene">
      <div class="redGlow" aria-hidden="true"></div>

      <div class="card" id="card" role="region" aria-label="Love control card">
        <div class="roseIcon" aria-hidden="true">🌹</div>

        <h1>For You — Patience</h1>

        <div id="loadingText" class="loadingText" role="status" aria-live="polite">Loading love...</div>

        <div class="progress" aria-hidden="true">
          <div class="progressBar" id="progressBar" aria-hidden="true"></div>
        </div>

        <button id="bloomButton" class="bloomButton" disabled aria-disabled="true" aria-pressed="false">
          TAP TO BLOOM
        </button>
      </div>

      <div class="flowerScene" aria-hidden="true">
        <div class="roseName">I miss you <br> How are you feeling today</div>

        <div class="stem" id="stem"></div>

        <div class="leaf left" aria-hidden="true"></div>
        <div class="leaf right" aria-hidden="true"></div>

        <div class="rose" aria-hidden="true">
          <div class="petal p1"></div>
          <div class="petal p2"></div>
          <div class="petal p3"></div>
          <div class="petal p4"></div>
          <div class="petal p5"></div>
          <div class="petal p6"></div>

          <div class="petal p7"></div>
          <div class="petal p8"></div>
          <div class="petal p9"></div>
          <div class="petal p10"></div>
          <div class="petal p11"></div>

          <div class="petal p12"></div>
          <div class="petal p13"></div>
          <div class="petal p14"></div>

          <div class="center"></div>
        </div>
      </div>

      <div class="fallingPetal fp1" aria-hidden="true"></div>
      <div class="fallingPetal fp2" aria-hidden="true"></div>
      <div class="fallingPetal fp3" aria-hidden="true"></div>
      <div class="fallingPetal fp4" aria-hidden="true"></div>
      <div class="fallingPetal fp5" aria-hidden="true"></div>

      <div class="heart heart1" aria-hidden="true">❤️</div>
      <div class="heart heart2" aria-hidden="true">💕</div>
      <div class="heart heart3" aria-hidden="true">❤️</div>
      <div class="heart heart4" aria-hidden="true">💕</div>
      <div class="heart heart5" aria-hidden="true">❤️</div>

      <div class="sparkle spark1" aria-hidden="true"></div>
      <div class="sparkle spark2" aria-hidden="true"></div>
      <div class="sparkle spark3" aria-hidden="true"></div>
      <div class="sparkle spark4" aria-hidden="true"></div>
      <div class="sparkle spark5" aria-hidden="true"></div>

      <div class="message" id="message" aria-hidden="true">
        <div class="messageText">This for you  PePe🥹🫂.</div>
        <div class="messageRose">🌹</div>
      </div>
    </section>
  </main>

  <script>
    (function(){
      const scene = document.getElementById('scene');
      const card = document.getElementById('card');
      const button = document.getElementById('bloomButton');
      const progress = document.getElementById('progressBar');
      const loadingText = document.getElementById('loadingText');
      const message = document.getElementById('message');

      // Use DOMContentLoaded for faster initialization
      window.addEventListener('DOMContentLoaded', () => {
        // Simulated load progress for graceful UX
        setTimeout(() => {
          progress.style.width = '100%';
        }, 180);

        setTimeout(() => {
          loadingText.textContent = 'Love compiled successfully.';
          button.disabled = false;
          button.classList.add('ready');
          button.setAttribute('aria-disabled', 'false');
          button.focus(); // optional: focus to indicate ready
        }, 2200);
      });

      // Bloom action: provide keyboard support (Enter/Space)
      function startBloom() {
        if (button.disabled) return;
        button.disabled = true;
        button.setAttribute('aria-disabled', 'true');
        button.setAttribute('aria-pressed', 'true');
        loadingText.textContent = 'Compiling love...';

        setTimeout(() => {
          card.classList.add('hide');
        }, 260);

        setTimeout(() => {
          scene.classList.add('bloom');
        }, 780);

        setTimeout(() => {
          message.setAttribute('aria-hidden', 'false');
          message.classList.add('show');
        }, 10500);
      }

      button.addEventListener('click', startBloom);

      button.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          startBloom();
        }
      });

      // If user prefers reduced motion, reduce timing and don't auto-focus
      const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) {
        // shorten animation timings and skip focus
        progress.style.transitionDuration = '600ms';
      }

    })();
  </script>
</body>
</html>
